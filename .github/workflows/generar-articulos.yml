name: Generar páginas de artículos y sitemap

on:
  push:
    branches: [main]
    paths:
      - "data/articulos.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar HTML de artículos y sitemap.xml
        run: node scripts/generar-articulos.js

      - name: Publicar cambios si los hay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articulos/ sitemap.xml
          if git diff --staged --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Generar páginas de artículos y sitemap [skip ci]"
            git push
          fi