backend:
  name: github
  repo: Samuuu07/fanaticos-del-futbol
  branch: main
  base_url: https://fanaticos-oauth.vercel.app

media_folder: "img"
public_folder: "img"

collections:
  - name: "articulos"
    label: "Artículos"
    files:
      - name: "articulos"
        label: "Artículos"
        file: "data/articulos.json"
        fields:
          - label: "Lista de artículos"
            name: "articulos"
            widget: "list"
            add_to_top: true
            label_singular: "artículo"
            summary: "{{fields.titulo}} — {{fields.fecha}} ({{fields.categoria}})"
            fields:
              - label: "Identificador de la URL (id)"
                name: "id"
                widget: "string"
                pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "Solo minúsculas, números y guiones, sin espacios ni tildes. Ej: mi-articulo-nuevo"]
                hint: "IMPORTANTE: rellénalo solo la primera vez, al crear el artículo. Si lo cambias después de publicar, el enlace que ya compartiste deja de funcionar. No lo edites en artículos que ya estén publicados."
              - { label: "Título", name: "titulo", widget: "string" }
              - label: "Categoría"
                name: "categoria"
                widget: "select"
                options: ["Noticia", "Crónica", "Opinión", "Análisis"]
              - { label: "Autor", name: "autor", widget: "string", default: "Manuel Cavia" }
              - label: "Fecha"
                name: "fecha"
                widget: "datetime"
                date_format: "DD/MM/YYYY"
                time_format: false
                format: "DD/MM/YYYY"
              - { label: "Imagen", name: "imagen", widget: "image" }
              - label: "Contenido"
                name: "contenido"
                widget: "markdown"
                buttons: ["bold", "italic", "heading-two", "heading-three"]
                editor_components: []
                modes: ["rich_text"]
                hint: "Selecciona texto y usa los botones de negrita/cursiva/título. Deja una línea en blanco entre párrafos. El primer párrafo se destaca solo, no hace falta marcarlo."

  - name: "programas"
    label: "Programas"
    files:
      - name: "programas"
        label: "Programas"
        file: "data/programas.json"
        fields:
          - label: "Lista de programas"
            name: "programas"
            widget: "list"
            add_to_top: true
            label_singular: "programa"
            summary: "{{fields.titulo}} — {{fields.fecha}}"
            fields:
              - { label: "Título / pregunta", name: "titulo", widget: "string" }
              - label: "Fecha"
                name: "fecha"
                widget: "datetime"
                date_format: "DD/MM/YYYY"
                time_format: false
                format: "DD/MM/YYYY"
              - { label: "Imagen", name: "imagen", widget: "image", required: false, hint: "Si no subes ninguna, se usa el logo de Radio Marca." }
              - { label: "Enlace de Radio Marca Burgos", name: "link", widget: "string" }